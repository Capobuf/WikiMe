{% extends "base.html" %}{% block title %}{{ 'Modifica sede' if site else 'Nuova sede' }}{% endblock %}{% block content %}{% set title = 'Modifica sede' if site else 'Nuova sede' %}{% include 'partials/page_header.html' %}
<form method="post" class="card"><div class="card-body"><div class="row g-3"><div class="col-md-6"><label class="form-label required">Nome</label><input class="form-control" name="name" required value="{{ site.name if site else '' }}"></div><div class="col-md-6"><label class="form-label">Indirizzo</label><input class="form-control" name="address" value="{{ site.address or '' if site else '' }}"></div><div class="col-12"><label class="form-label">Descrizione</label><textarea class="form-control" name="description" rows="3">{{ site.description or '' if site else '' }}</textarea></div><div class="col-12"><label class="form-label">Note</label><textarea class="form-control" name="notes" rows="3">{{ site.notes or '' if site else '' }}</textarea></div></div></div><div class="card-footer text-end"><a class="btn" href="{{ url_for('sites.index') }}">Annulla</a><button class="btn btn-primary ms-2">Salva</button></div></form>{% endblock %}
